<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SENTINEL-DISPATCH{% endblock %}</title>

  <!-- Fuentes CRT/phosphor -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500&display=swap">

  <!-- Hoja de estilos CRT -->
  <link rel="stylesheet" href="/static/crt.css">

  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- Overlay de scanlines: fixed, cubre todo, no intercepta eventos -->
  <div class="scanlines" aria-hidden="true"></div>

  <nav class="consola-nav">
    <span class="consola-nav__marca">SENTINEL-DISPATCH</span>
    <a href="/consola/triaje" class="{% if vista_activa == 'triaje' %}activo{% endif %}">TRIAJE</a>
    <a href="/consola/despacho" class="{% if vista_activa == 'despacho' %}activo{% endif %}">DESPACHO</a>
    <a href="/consola/unidades" class="{% if vista_activa == 'unidades' %}activo{% endif %}">UNIDADES</a>
    <a href="/consola/log" class="{% if vista_activa == 'log' %}activo{% endif %}">LOG</a>
  </nav>

  <main class="consola {% block consola_clase %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <footer class="status-bar" aria-hidden="true">
    <span>SENTINEL-DISPATCH v1</span>
    <span class="status-ok">■ SISTEMA ACTIVO</span>
    <span>SAMU — IV REGIÓN</span>
  </footer>

  <!-- HTMX 2.x — hipermedia sin SPA -->
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</body>
</html>
